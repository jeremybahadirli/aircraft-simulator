<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Aircraft Simulator Config</title>
		<style>
			html,
			body {
				width: 100%;
				height: 100%;
				margin: 0;
				background: #1e1e1e;
				color: #ddd;
				font: 13px system-ui, sans-serif;
			}
			body {
				display: flex;
				flex-direction: column;
			}
			footer {
				box-sizing: border-box;
				display: flex;
				align-items: center;
				gap: 12px;
				padding: 9px 14px;
				background: #252526;
			}
			.tabbar {
				box-sizing: border-box;
				display: flex;
				gap: 2px;
				padding: 6px 10px 0;
				background: #252526;
			}
			.tabbar button {
				border: 0;
				border-bottom: 2px solid transparent;
				padding: 7px 10px;
				background: transparent;
				color: #aaa;
				font: inherit;
				cursor: pointer;
			}
			.tabbar button[aria-selected='true'] {
				border-bottom-color: #4b94d0;
				color: #fff;
			}
			.tabbar button:hover {
				color: #fff;
			}
			#load-default {
				border: 1px solid #555;
				border-radius: 3px;
				padding: 5px 10px;
				background: #333;
				color: #ddd;
				font: inherit;
				white-space: nowrap;
				cursor: pointer;
			}
			#load-default:hover:not(:disabled) {
				background: #444;
			}
			#load-default:disabled {
				color: #888;
				cursor: default;
			}
			#save {
				border: 1px solid #4b94d0;
				border-radius: 3px;
				padding: 5px 12px;
				background: #0e639c;
				color: white;
				font: inherit;
				cursor: pointer;
			}
			#save:hover {
				background: #1177bb;
			}
			#editor {
				flex: 1;
				min-height: 0;
			}
			footer {
				min-height: 34px;
				border-top: 1px solid #333;
				color: #aaa;
			}
			#status {
				flex: 1;
				min-width: 0;
				white-space: pre-line;
			}
			#status.error {
				color: #f48771;
			}
		</style>
	</head>
	<body>
		<nav class="tabbar" role="tablist" aria-label="Config files">
			<button id="tab-config" type="button" role="tab" aria-selected="true">
				config.json
			</button>
			<button
				id="tab-separation-practice"
				type="button"
				role="tab"
				aria-selected="false"
			>
				separation-practice-config.json
			</button>
		</nav>
		<div id="editor" aria-label="Simulation config editor"></div>
		<footer>
			<span id="status">Loading Monaco Editor…</span>
			<button id="load-default" type="button" disabled>Load Default</button>
			<button id="save" type="button">Save &amp; Run</button>
		</footer>
		<script type="module" src="./dist/config-editor.js"></script>
	</body>
</html>
